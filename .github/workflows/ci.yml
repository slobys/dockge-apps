name: Dockge Apps CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'

permissions: {}

jobs:
  ci:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22] # Can be changed
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Disable autocrlf
        run: | # Mainly for Windows
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node}}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Catalog tests
        run: npm run test:catalog

      - name: Check Typescript
        run: npm run check-ts

      - name: Build
        run: npm run build:frontend

      - name: Docker Compose syntax
        run: docker compose -f compose.apps.yaml config -q
      # more things can be add later like tests etc..
